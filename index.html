<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layer Studio · 打印动画</title><body><header><b><i>◒</i> LAYER <span>STUDIO</span></b><small>G-CODE 动画工作室</small><div class="spacer"></div><button id="open">打开切片文件</button><button id="sample">三色示例</button><button id="save">保存场景</button><button id="load">载入场景</button><button id="export" class="primary">导出视频 ↗</button></header><main><section id="stage"><div id="badges"><span id="filename">三色花瓶 · 示例</span><span id="stats">正在准备…</span></div><div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div id="notice"></div><div id="progress" hidden><b id="progressText"></b><progress max="1" value="0"></progress><button id="cancel">取消导出</button></div></section><aside><div class="section"><label class="eyebrow">01 / 耗材与表面</label><h2>每一层，都有质感。</h2><div id="palette"></div><label>表面材质<select id="finish"><option value="satin">缎面塑料</option><option value="matte">哑光塑料</option><option value="gloss">亮面塑料</option><option value="silk">丝绸高光</option></select></label><label>网格精度<select id="quality"><option value="auto">自动 · 按文件规模</option><option value="low">低 · 更轻快</option><option value="medium">中 · 均衡</option><option value="high">高 · 精细层纹</option><option value="ultra">超精细 · 微距展示</option></select></label><p id="meshStats"></p><label>挤出线宽<input id="beadWidth" type="range" min="0.8" max="1.15" step="0.01" value="1"></label><label>层间间隙（毫米）<input id="layerGap" type="number" min="0" max="0.04" step="0.002" value="0.008"></label><label>打印板<select id="plateStyle"><option value="gold">拓竹金色纹理 PEI · 精细颗粒</option><option value="dark">深色纹理 PEI</option><option value="smooth">光滑黑板</option><option value="shadow">仅影棚地面</option></select></label><label class="check"><input id="purge" type="checkbox">显示擦料塔 / 起始线</label><label class="check"><input id="support" type="checkbox" checked>显示支撑</label></div><div class="section"><label class="eyebrow">02 / 影棚灯光</label><label>布光<select id="lighting"><option value="studio">柔光影棚</option><option value="dramatic">戏剧侧光</option><option value="warm">暖调日光</option></select></label><label>曝光 <output id="exposureVal">0.8</output><input id="exposure" type="range" min="0.5" max="1.6" step="0.05" value="0.8"></label><label>阴影柔和度<input id="softness" type="range" min="1" max="5" step=".5" value="3"></label><label class="check"><input id="ao" type="checkbox" checked>环境遮蔽 GTAO · 层间阴影更干净</label><label class="check"><input id="dof" type="checkbox">微距景深 · 导出更慢</label><label>背景预设<select id="bgPreset"><option value="#0b0d10" selected>深邃纯黑（默认）</option><option value="#191c20">深石墨灰</option><option value="#222b35">影棚蓝灰</option><option value="custom">自定义</option></select></label><label>背景颜色<input id="background" type="color" value="#0b0d10"></label></div><div class="section"><label class="eyebrow">03 / 相机编排</label><label>运动模式<select id="camera"><option value="rise">缓慢环绕 ＋ 随打印高度抬升</option><option value="orbit">缓慢环绕</option><option value="fixed">固定机位</option><option value="keys">自定义关键帧</option></select></label><label>环绕角度<input id="orbit" type="range" min="0" max="360" value="100"></label><button id="key">＋ 保存当前视角为关键帧</button><div id="keys"></div></div><div class="section"><label class="eyebrow">04 / 成片设置</label><label>导出抗锯齿<select id="aaQuality"><option value="standard">标准 · 原尺寸渲染（最快）</option><option value="high" selected>高 · 1.5× 超采样（推荐）</option><option value="ultra">极致 · 2× 超采样（最慢）</option></select></label><label>分辨率<select id="resolution"><option value="720">1280 × 720</option><option value="1080" selected>1920 × 1080</option></select></label><label>时长（含前后停留）<input id="duration" type="number" min="4" max="120" value="20"></label><label>生长方式<select id="growth"><option value="path">沿挤出路径连续生长</option><option value="layer">逐层生长</option></select></label><label>保存方式<select id="destination"><option value="download">生成后下载（推荐）</option><option value="disk">直接写入磁盘</option></select></label><p id="exportStatus" role="status"></p><div id="exportResult" hidden><video id="resultVideo" controls playsinline></video><a id="videoDownload">下载视频</a></div><p>30 FPS · 无水印 · 本机逐帧渲染<br>开头停留 0.5 秒，成品停留 2 秒。</p></div></aside></main><footer><button id="reset">↤</button><button id="play" class="primary">▶</button><input id="timeline" type="range" min="0" max="1" step=".0001" value="1"><span id="time">20.0 / 20.0 s</span><span id="layer">100%</span></footer><input id="file" type="file" accept=".gcode,.gcode.3mf,.3mf" hidden><input id="sceneFile" type="file" accept=".json" hidden><script type="module" src="/src/main.js"></script></body></html>
